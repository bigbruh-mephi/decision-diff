[project]
name = "decision-diff"
version = "0.1.0"
description = "Change analysis for decision-engine strategy versions: normalize, compare, report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "lxml>=6.1.3",
    "msgpack>=1.2.4",
    "orjson>=3.13.0",
    "pyarrow>=26.0.1",
    "pyroaring>=1.2.0",
    "pyyaml>=6.0.3",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
"src/decision_diff/engine/procedures.py" = ["S102"]
