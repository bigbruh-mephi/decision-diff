[project]
name = "decision-diff"
version = "0.1.0"
description = "Change analysis for decision-engine strategy versions: normalize, compare, report"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.2.2",
    "argon2-cffi>=25.1.0",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "msgpack>=1.2.4",
    "numpy>=2.5",
    "orjson>=3.13.0",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pyarrow>=26.0.1",
    "pyroaring>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_diff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
"src/decision_diff/engine/procedures.py" = ["S102"]
"src/decision_diff/pipeline.py" = ["BLE001", "S102", "S307"]
"src/decision_diff/worker.py" = ["BLE001"]
"src/decision_diff/sandbox.py" = ["BLE001"]

[project.scripts]
dd = "decision_diff.cli:cli"
dd-worker = "decision_diff.worker:cli"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
