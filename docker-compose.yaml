name: decision-diff

x-app-env: &app-env
  DD_PG_URL: postgresql://${DD_PG_USER:-dd}:${DD_PG_PASSWORD:?set DD_PG_PASSWORD in .env}@postgres:5432/dd
  DD_AMQP_URL: amqp://${DD_AMQP_USER:-dd}:${DD_AMQP_PASSWORD:?set DD_AMQP_PASSWORD in .env}@rabbitmq:5672/dd
  DD_DATA_DIR: /data
  DD_DATASETS_DIR: /datasets
  DD_PROCEDURES_DIR: /procedures

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DD_PG_USER:-dd}
      POSTGRES_PASSWORD: ${DD_PG_PASSWORD:?set DD_PG_PASSWORD in .env}
      POSTGRES_DB: dd
    volumes: [pg-data:/var/lib/postgresql]
    ports: ["127.0.0.1:${DD_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DD_PG_USER:-dd} -d dd"]
      interval: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 512m}}}

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${DD_AMQP_USER:-dd}
      RABBITMQ_DEFAULT_PASS: ${DD_AMQP_PASSWORD:?set DD_AMQP_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: dd
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/20-dd.conf:/etc/rabbitmq/conf.d/20-dd.conf:ro
    ports: ["127.0.0.1:${DD_AMQP_PORT:-5672}:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30
    deploy: {resources: {limits: {memory: 512m}}}

  api:
    build: .
    image: decision-diff:latest
    environment:
      <<: *app-env
      DD_ADMIN_LOGIN: ${DD_ADMIN_LOGIN:-admin}
      DD_ADMIN_PASSWORD: ${DD_ADMIN_PASSWORD:?set DD_ADMIN_PASSWORD in .env}
      DD_OPEN_REGISTRATION: ${DD_OPEN_REGISTRATION:-0}
      TMPDIR: /data/tmp
      DD_METRICS_TOKEN: ${DD_METRICS_TOKEN:-}
      DD_LLM_BASE_URL: ${DD_LLM_BASE_URL:-}
      DD_LLM_API_KEY: ${DD_LLM_API_KEY:-}
      DD_LLM_MODEL: ${DD_LLM_MODEL:-}
    user: "10001"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - runs:/data
      - ${DD_DATASETS_PATH:-./datasets}:/datasets
      - ./procedures:/procedures:ro
    ports: ["${DD_HTTP_PORT:-8080}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 12
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 1g}}}

  worker:
    image: decision-diff:latest
    command: ["dd-worker", "--procs", "${DD_WORKER_PROCS:-4}"]
    environment:
      <<: *app-env
      DD_USER_WINDOW: ${DD_USER_WINDOW:-4}
      DD_SANDBOX: ${DD_SANDBOX:-strict}
      DD_SANDBOX_MEM_MB: ${DD_SANDBOX_MEM_MB:-8192}
      DD_LLM_BASE_URL: ${DD_LLM_BASE_URL:-}
      DD_LLM_API_KEY: ${DD_LLM_API_KEY:-}
      DD_LLM_MODEL: ${DD_LLM_MODEL:-}
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    volumes:
      - runs:/data
      - ${DD_DATASETS_PATH:-./datasets}:/datasets:ro
      - ./procedures:/procedures:ro
    depends_on:
      api: {condition: service_healthy}
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
    deploy: {resources: {limits: {memory: 4g, pids: 512}}}

volumes:
  pg-data:
  rabbitmq-data:
  runs:
