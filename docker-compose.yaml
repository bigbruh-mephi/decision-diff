name: decision-diff

x-app-env: &app-env
  DD_PG_URL: postgresql://${DD_PG_USER:-dd}:${DD_PG_PASSWORD:-dd}@postgres:5432/dd
  DD_AMQP_URL: amqp://${DD_AMQP_USER:-dd}:${DD_AMQP_PASSWORD:-dd}@rabbitmq:5672/dd
  DD_DATA_DIR: /data
  DD_DATASETS_DIR: /datasets
  DD_PROCEDURES_DIR: /procedures

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${DD_PG_USER:-dd}
      POSTGRES_PASSWORD: ${DD_PG_PASSWORD:-dd}
      POSTGRES_DB: dd
    volumes: [pg-data:/var/lib/postgresql]
    ports: ["127.0.0.1:${DD_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DD_PG_USER:-dd} -d dd"]
      interval: 5s
      retries: 20
    deploy: {resources: {limits: {memory: 512m}}}

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${DD_AMQP_USER:-dd}
      RABBITMQ_DEFAULT_PASS: ${DD_AMQP_PASSWORD:-dd}
      RABBITMQ_DEFAULT_VHOST: dd
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/20-dd.conf:/etc/rabbitmq/conf.d/20-dd.conf:ro
    ports: ["127.0.0.1:${DD_AMQP_PORT:-5672}:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 30
    deploy: {resources: {limits: {memory: 512m}}}

volumes:
  pg-data:
  rabbitmq-data:
